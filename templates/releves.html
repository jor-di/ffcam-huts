<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Suivi des relevés · Dernière couchette</title>
<link rel="icon" type="image/svg+xml" href="__FAVICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Fetch log page: same light "Crêtes" look as the map (cream paper tickets, pine-green ridges). */
  :root {
    --ground:#f5f2ea; --paper:#fffdf7; --ink:#1f2a24; --ink-2:#66716b; --rule:#ddd8cc; --perf:#d3cbb8; --pine:#24493a;
    --ok:#2f8a57; --low:#d98a2b; --full:#c8473d; --req:#6b5ca5; --skip:#c9c3dc;
    --display:Fraunces, Georgia, serif; --body:Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme:light;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font:14px/1.5 var(--body); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:980px; margin:0 auto; padding:0 max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .label { font:600 10.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); }

  header { position:relative; overflow:hidden; background:linear-gradient(180deg,#dfe9e1 0%,var(--ground) 100%); padding:20px 0 44px; }
  header .wrap { padding-bottom:0; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header svg.logo { width:36px; height:36px; flex:none; }
  header h1 { margin:0; font:700 25px/1 var(--display); }
  header small { display:block; font:500 10.5px/1.3 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin-top:5px; }
  header a.back { margin-left:auto; font:600 13px/1 var(--body); color:var(--pine); text-decoration:none; border:1px solid var(--pine); border-radius:999px; padding:8px 12px; background:var(--paper); }
  header a.back:hover { background:#e8efe9; }
  header svg.ridge { position:absolute; left:0; right:0; bottom:-1px; width:100%; height:38px; }

  main.wrap { display:grid; gap:18px; }
  .runbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:12px 14px; }
  .runbar .when { font:700 17px/1.2 var(--display); }
  .runbar .facts { font:400 12px/1.4 var(--mono); color:var(--ink-2); }
  .runbar .pill { margin-left:auto; }
  .pill { display:inline-flex; align-items:center; gap:6px; font:600 11px/1 var(--mono); letter-spacing:.04em; padding:5px 9px; border-radius:999px; white-space:nowrap; }
  .pill.ok { background:#e3f0e7; color:#20603d; }
  .pill.warn { background:#f8ebd9; color:#8a5414; }
  .pill.err { background:#f6e0dd; color:#9b2f26; }
  .pill.skip { background:#ebe8f3; color:#4f437f; }
  .pill.info { background:#eef1ee; color:#4d5a53; }

  .sources { display:grid; grid-template-columns:repeat(auto-fill, minmax(208px, 1fr)); gap:10px; margin-top:8px; }
  .src { display:grid; grid-template-columns:1fr auto; background:var(--paper); border:1px solid var(--rule); border-radius:8px; position:relative; min-width:0; }
  .src.bad { border-color:var(--full); }
  .src.meh { border-color:var(--low); }
  .src .main { padding:10px 11px 9px; border-right:2px dashed var(--perf); min-width:0; display:grid; gap:4px; }
  .src .nm { font:700 15px/1.15 var(--display); }
  .src .sys { font:400 10.5px/1.3 var(--mono); color:var(--ink-2); }
  .src .spark { display:flex; gap:2px; margin-top:2px; }
  .src .spark i { width:5px; height:12px; border-radius:1.5px; background:var(--ok); }
  .src .spark i.e { background:var(--full); } .src .spark i.w { background:var(--low); } .src .spark i.s { background:var(--skip); } .src .spark i.n { background:#e4e0d6; }
  .src .meta { font:400 10px/1.3 var(--mono); color:var(--ink-2); }
  .src .stub { display:grid; place-content:center; text-align:center; padding:8px 4px; width:84px; }
  .src .stub b { font:600 17px/1 var(--mono); font-variant-numeric:tabular-nums; }
  .src .stub small { font:500 9px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); }
  .src::before, .src::after { content:""; position:absolute; right:79px; width:10px; height:10px; border-radius:50%; background:var(--ground); border:1px solid var(--rule); }
  .src::before { top:-6px; } .src::after { bottom:-6px; }

  .filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); background:transparent; color:var(--ink-2); border-radius:999px;
    padding:6px 11px; font:500 12.5px/1 var(--body); cursor:pointer; }
  .chip i { font:600 11px/1 var(--mono); font-style:normal; opacity:.75; }
  .chip:hover { border-color:var(--pine); color:var(--ink); }
  .chip[aria-pressed=true] { background:var(--paper); border-color:var(--pine); color:var(--ink); }
  .chip:focus-visible, header a.back:focus-visible, .search:focus { outline:2px solid var(--low); outline-offset:2px; }
  .search { flex:1 1 200px; min-width:0; border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:8px; padding:7px 10px; font:inherit; }

  .tablewrap { overflow-x:auto; background:var(--paper); border:1px solid var(--rule); border-radius:8px; }
  table { border-collapse:collapse; width:100%; min-width:720px; font-size:13px; }
  th { text-align:left; font:600 10px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); padding:11px 10px 9px; border-bottom:2px dashed var(--perf); white-space:nowrap; }
  td { padding:8px 10px; border-bottom:1px solid #ece7dc; vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  td.num { font:500 12px/1.3 var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.src-c { font:400 11px/1.3 var(--mono); color:var(--ink-2); white-space:nowrap; }
  td.msg { color:var(--ink-2); font-size:12px; min-width:240px; }
  td.msg a { color:var(--pine); word-break:break-all; }
  td b { font-weight:600; }
  tr.e td:first-child { box-shadow:inset 3px 0 0 var(--full); }
  tr.w td:first-child { box-shadow:inset 3px 0 0 var(--low); }
  td.empty { text-align:center; padding:24px 12px; color:var(--ink-2); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font:400 11px/1.3 var(--mono); color:var(--ink-2); }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .none { background:var(--paper); border:1px dashed var(--rule); border-radius:8px; padding:24px; text-align:center; color:var(--ink-2); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <svg class="logo" viewBox="0 0 34 34" fill="none" stroke="#24493a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 31V12M28 31V12"/><path d="M6 19h22M6 27h22"/><path d="M9 19v-3.5h7V19M9 27v-3.5h7V27"/>
      <path d="m22 3 1.2 2.6 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4z" fill="#d98a2b" stroke="none"/></svg>
    <div><h1>Suivi des relevés</h1><small id="sub">Dernière couchette</small></div>
    <a class="back" href="../">← Retour à la carte</a>
  </div>
  <svg class="ridge" viewBox="0 0 380 38" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 38 L0 22 L40 16 L70 22 L104 6 L140 20 L178 11 L212 24 L250 9 L286 20 L322 13 L356 22 L380 18 L380 38 Z" fill="#24493a" opacity=".22"/>
    <path d="M0 38 L0 31 L60 27 L120 33 L190 26 L260 32 L330 27 L380 30 L380 38 Z" fill="#f5f2ea"/></svg>
</header>
<main class="wrap" id="app"></main>
<script>
const LOG = __LOG__;
const SOURCES = {
  FFCAM: ['Centrale FFCAM', 'portail FFCAM · POST availability'],
  VANOISE: ['Portail Vanoise', 'centrale FFCAM · apporigin VANOISE'],
  NEOUVIELLE: ['Néouvielle', 'centrale FFCAM · apporigin NEOUVIELLE'],
  BOREON: ['Boréon', 'centrale FFCAM · apporigin BOREON'],
  OPENSYSTEM: ['Open System', 'Parc de la Vanoise · etape-rest'],
  REFUGEPRO: ['Refuge Pro', 'calendriers embed · refuge-pro.com'],
  WPBS: ['WP Booking System', 'calendrier WordPress · refugedelacoire.fr'],
  MANUAL: ['Sur demande', 'catalog/manual/manual_huts.json · pas de requête'],
};
const ST = { ok:['ok', 'OK'], warn:['warn', 'À vérifier'], err:['err', 'Erreur'], skip:['skip', 'Non relevé'] };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = iso => iso ? new Date(iso).toLocaleString('fr-FR', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
const short = iso => iso ? new Date(iso).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }).replace(' ', ' ') : '—';
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const app = document.getElementById('app');

// weekly check of the cards' links (bin/check-links → history/links.json)
function linksHtml() {
  const L = LOG.links;
  if (!L) return '';
  const c = L.counts, KIND = { site:'Site du refuge', booking:'Résa', page:'Lien de la page' };
  const pill = c.err ? `<span class="pill err">${c.err} cassé${c.err > 1 ? 's' : ''}${c.warn ? ` · ${c.warn} à vérifier` : ''}</span>`
    : c.warn ? `<span class="pill warn">${c.warn} à vérifier</span>` : `<span class="pill ok">✓ ${L.checked}/${L.checked} liens</span>`;
  const rows = L.problems.slice().sort((a, b) => (a.state === 'err' ? 0 : 1) - (b.state === 'err' ? 0 : 1) || a.name.localeCompare(b.name, 'fr'))
    .map(r => `<tr class="${r.state === 'err' ? 'e' : 'w'}"><td><span class="pill ${r.state}">${r.state === 'err' ? 'Cassé' : 'À vérifier'}</span></td>
      <td><b>${esc(r.name)}</b></td><td class="src-c">${KIND[r.kind]}</td><td class="msg"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></td><td class="msg">${esc(r.msg)}</td></tr>`).join('');
  return `<div style="display:grid;gap:8px"><div class="label">Liens des fiches et des pages</div>
    <div class="runbar"><div><div class="when">Vérifiés le ${when(L.at)}</div><div class="facts">${L.checked} liens · contrôle hebdomadaire</div></div>${pill}</div>
    ${rows ? `<div class="tablewrap"><table><thead><tr><th>État</th><th>Refuge / page</th><th>Lien</th><th>Adresse</th><th>Détail</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}</div>`;
}

if (!LOG.last_run) {
  app.innerHTML = `<div class="none">Pas encore de relevé enregistré. La page se remplira après le prochain relevé automatique.</div>`;
} else {
  const run = LOG.last_run, runs = LOG.runs || [];
  document.getElementById('sub').textContent = `${run.huts.length} refuges · ${Object.keys(run.sources).length} sources de données`;
  const errs = run.huts.filter(h => h.state === 'err').length, warns = run.huts.filter(h => h.state === 'warn').length;
  const fetched = run.huts.filter(h => h.state !== 'skip').length; // huts booked offline are not fetched
  const pill = errs ? `<span class="pill err">${errs} erreur${errs > 1 ? 's' : ''}${warns ? ` · ${warns} à vérifier` : ''}</span>`
    : warns ? `<span class="pill warn">${warns} à vérifier</span>` : `<span class="pill ok">✓ ${fetched}/${fetched} relevés</span>`;

  // per source: 24 last runs (oldest left), last run without error
  const spark = key => runs.slice(0, 24).reverse().map(r => {
    const s = r.sources[key];
    if (!s) return '<i class="n"></i>';
    return `<i class="${s.err ? 'e' : s.warn ? 'w' : s.skip === s.total ? 's' : ''}"></i>`;
  }).join('');
  const lastGood = key => (runs.find(r => r.sources[key] && !r.sources[key].err && r.sources[key].skip !== r.sources[key].total) || {}).at;
  const sourcesHtml = Object.entries(run.sources).map(([key, s]) => {
    const [name, sys] = SOURCES[key] || [key, ''];
    const cls = s.err ? 'bad' : s.warn ? 'meh' : '';
    const good = s.total - s.err - s.warn - s.skip;
    const stub = s.skip === s.total ? `<b style="color:var(--req)">${s.skip}</b><small>non<br>relevés</small>`
      : `<b style="color:${s.err ? 'var(--full)' : s.warn ? 'var(--low)' : 'var(--ok)'}">${good}<span style="color:var(--ink-2);font-weight:400">/${s.total}</span></b><small>sans<br>erreur</small>`;
    const meta = s.skip === s.total ? 'réservation hors ligne' : `${s.seconds.toFixed(1)} s cumulées · dernier succès ${short(lastGood(key))}`;
    return `<div class="src ${cls}"><div class="main"><div class="nm">${esc(name)}</div><div class="sys">${esc(sys)}</div>
      <div class="spark" title="${Math.min(24, runs.length)} derniers relevés, le plus récent à droite">${spark(key)}</div><div class="meta">${meta}</div></div>
      <div class="stub">${stub}</div></div>`;
  }).join('');

  app.innerHTML = `
    <div class="runbar"><div><div class="when">Relevé du ${when(run.at)}</div>
      <div class="facts">${run.requests} requêtes · ${run.seconds} s · ${esc(run.trigger)} · ${runs.length} relevé${runs.length > 1 ? 's' : ''} gardé${runs.length > 1 ? 's' : ''}</div></div>${pill}</div>
    <div><div class="label">Par source de données</div><div class="sources">${sourcesHtml}</div></div>
    <div style="display:grid;gap:8px">
      <div class="filters" role="group" aria-label="Filtrer les refuges" id="filters"></div>
      <div class="tablewrap"><table><thead><tr><th>État</th><th>Refuge</th><th>Source</th><th>Nuits reçues</th><th>Durée</th><th>Dernier succès</th><th>Détail</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
    <div class="legend"><span><i style="background:var(--ok)"></i>relevé sans erreur</span><span><i style="background:var(--low)"></i>à vérifier (réponse vide)</span><span><i style="background:var(--full)"></i>erreur</span><span><i style="background:var(--skip)"></i>non relevé (réservation hors ligne)</span><span><i style="background:#e4e0d6"></i>source absente de ce relevé</span></div>
    ${linksHtml()}`;

  // hut table
  const order = { err:0, warn:1, ok:2, skip:3 };
  const rows = run.huts.map(h => ({ ...h, ...(LOG.huts[h.id] || { name:h.id, portal:'?' }) }))
    .sort((a, b) => order[a.state] - order[b.state] || (b.msg ? 1 : 0) - (a.msg ? 1 : 0) || a.name.localeCompare(b.name, 'fr'));
  const FILTERS = [
    ['pb', 'À traiter', r => r.state === 'err' || r.state === 'warn'],
    ['err', 'Erreurs', r => r.state === 'err'],
    ['info', 'Remarques', r => r.state === 'ok' && r.msg],
    ['skip', 'Non relevés', r => r.state === 'skip'],
    ['all', 'Tous', () => true],
  ];
  const state = { f: 'pb', q: '' };
  const render = () => {
    document.getElementById('filters').innerHTML = FILTERS.map(([k, l, fn]) =>
      `<button type="button" class="chip" data-f="${k}" aria-pressed="${state.f === k}">${l}<i>${rows.filter(fn).length}</i></button>`).join('')
      + `<input class="search" id="q" type="search" placeholder="Chercher un refuge…" aria-label="Chercher un refuge" value="${esc(state.q)}">`;
    document.querySelectorAll('#filters .chip').forEach(c => c.onclick = () => { state.f = c.dataset.f; render(); });
    const q = document.getElementById('q');
    q.oninput = () => { state.q = q.value; renderRows(); };
    renderRows();
  };
  const renderRows = () => {
    const fn = FILTERS.find(f => f[0] === state.f)[2], q = norm(state.q);
    const shown = rows.filter(r => fn(r) && (!q || norm(r.name).includes(q)));
    document.getElementById('rows').innerHTML = shown.length ? shown.map(r => `<tr class="${r.state === 'err' ? 'e' : r.state === 'warn' ? 'w' : ''}">
      <td><span class="pill ${r.state === 'ok' && r.msg ? 'info' : ST[r.state][0]}">${ST[r.state][1]}</span></td>
      <td><b>${esc(r.name)}</b></td><td class="src-c">${esc((SOURCES[r.portal] || [r.portal])[0])}</td>
      <td class="num">${r.nights ?? '—'}</td><td class="num">${r.state === 'skip' ? '—' : `${r.seconds.toFixed(1)} s`}</td>
      <td class="num">${short(LOG.last_success?.[r.id])}</td><td class="msg">${esc(r.msg) || '—'}</td></tr>`).join('')
      : `<tr><td colspan="7" class="empty">${state.f === 'pb' && !q ? 'Rien à traiter : tous les refuges ont été relevés sans erreur.' : 'Aucun refuge ne correspond.'}</td></tr>`;
  };
  render();
}
</script>
</body>
</html>
