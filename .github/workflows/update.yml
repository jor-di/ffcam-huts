name: Update availability

on:
  # No GitHub schedule (it ran hours late or not at all). Runs are started by cron-job.org (see
  # HANDOVER, « Déclenchement par cron-job.org ») and the "Run workflow" button, both through
  # POST /repos/jor-di/ffcam-huts/actions/workflows/update.yml/dispatches
  #   {"ref": "main", "inputs": {"source": "cron-job.org"}}
  workflow_dispatch:
    inputs:
      source:
        description: "Who started this run (shown on the /releves/ page)"
        required: false
        default: "manuel (Actions)"
  push:
    branches: [main] # rebuild the site after a code/data change, from the last fetch (no new fetch)

permissions:
  contents: write # push the history to the `data` branch
  pages: write # publish the map
  issues: write # mail alert: GitHub issue « Relevés en erreur » (bin/check-fetch-alerts)
  id-token: write # required by deploy-pages

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Paris # history timestamps and "today" in French time
      TRIGGER_SOURCE: ${{ inputs.source }} # set by workflow_dispatch (cron-job.org, or the button)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby (version from .ruby-version)
        uses: ruby/setup-ruby@v1

      # Offline tests first: if one fails, the job stops here, before the history (data
      # branch) and the published map (Pages) are touched.
      - name: Unit tests
        run: tests/unit.sh

      - name: Replay tests (recorded responses, outputs compared with tests/golden)
        run: tests/check.sh

      - name: Check out the history (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: history

      # A push (code, map, docs) only rebuilds the site from the last fetch, kept in the Actions
      # cache by every fetch below: online in ~30 s instead of ~3 min, and no extra load on the
      # booking sites. No cached fetch (none in 7 days, first run): fetch anyway.
      - name: Last fetch (push only)
        id: last
        if: github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: data/latest.csv
          key: latest-csv-${{ github.run_id }}
          restore-keys: latest-csv-

      - name: Fetch availability (and record history changes)
        id: fetch
        if: steps.last.outputs.cache-matched-key == ''
        run: |
          mkdir -p data
          bin/fetch-availability --history -o data/latest.csv

      - name: Keep this fetch for the next push
        if: steps.fetch.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: data/latest.csv
          key: latest-csv-${{ github.run_id }}

      - name: Build the map
        run: bin/build-site data/latest.csv -o site/index.html

      - name: Commit history changes
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no availability change"
          else
            git commit -q -m "availability $(date '+%Y-%m-%d %H:%M')"
            git push -q
          fi

      # Huts failing 10 runs in a row: GitHub issue « Relevés en erreur » (GitHub mails it), updated
      # when the list changes, closed when it is empty. Never blocks the publication.
      - name: Mail alert on failing huts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bin/check-fetch-alerts

      # Login by first name + password: the pages are encrypted (see HANDOVER, « Accès »). Fails
      # without the SITE_USERS secret rather than publishing them open; the history is already saved.
      - name: Protect the site
        env:
          SITE_USERS: ${{ secrets.SITE_USERS }}
        run: bin/protect-site site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Deploy in its own job: run right after the upload in the same job, deploy-pages sometimes
  # does not find the artifact yet (« No artifacts named "github-pages" », actions/deploy-pages#451;
  # it failed the runs of 23/11 22:46 and 24/11 07:07), and re-running cannot fix that run.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
