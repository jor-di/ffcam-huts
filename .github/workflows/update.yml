name: Update availability

on:
  schedule:
    # times are UTC. Season (Dec-Apr, Jun-Sep): every hour at minute 7.
    - cron: "7 * * 12,1-4,6-9 *"
    # Off season (May, Oct, Nov): once a day, ~8-9h in Paris.
    - cron: "7 7 * 5,10,11 *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main] # rebuild the map after a code/data change

permissions:
  contents: write # push the history to the `data` branch
  pages: write # publish the map
  id-token: write # required by deploy-pages

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Paris # history timestamps and "today" in French time
    steps:
      - uses: actions/checkout@v4

      - name: Check out the history (data branch)
        uses: actions/checkout@v4
        with:
          ref: data
          path: history

      - name: Fetch availability (and record history changes)
        run: |
          mkdir -p data site
          python3 ffcam_availability.py -o data/latest.csv

      - name: Build the map
        run: python3 build_map.py data/latest.csv -o site/index.html

      - name: Commit history changes
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no availability change"
          else
            git commit -q -m "availability $(date '+%Y-%m-%d %H:%M')"
            git push -q
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
