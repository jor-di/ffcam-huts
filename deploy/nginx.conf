# nginx site for the huts map (installed by setup_server.sh as /etc/nginx/sites-available/refuges)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # replace with your domain if you have one (needed for HTTPS)

    root /var/www/refuges;
    index index.html;

    # the page is rebuilt every 2 hours: let browsers re-check it
    location = /index.html { add_header Cache-Control "no-cache"; }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # Optional password protection: run `sudo deploy/setup_server.sh --password <user>`
    # include /etc/nginx/refuges-auth.conf;
}
