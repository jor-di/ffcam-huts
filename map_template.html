<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dernière couchette</title>
<!-- favicon: the logo (bunk beds under a star) on a cream tile, readable on light and dark tabs -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='7' fill='%23f5f2ea'/%3E%3Cg fill='none' stroke='%2324493a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 31V12M28 31V12'/%3E%3Cpath d='M6 19h22M6 27h22'/%3E%3Cpath d='M9 19v-3.5h7V19M9 27v-3.5h7V27'/%3E%3C/g%3E%3Cpath d='m22 3 1.2 2.6 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4z' fill='%23d98a2b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* "Crêtes" look: cream paper tickets on a light ground, pine-green ridges. Deliberately light-only. */
  :root {
    --ground:#f5f2ea; --paper:#fffdf7; --ink:#1f2a24; --ink-2:#66716b; --rule:#ddd8cc; --perf:#d3cbb8;
    --pine:#24493a; --pine-soft:#dfe9e1; --glow:#d98a2b;
    --ok:#2f8a57; --low:#d98a2b; --full:#c8473d; --closed:#9aa29c;
    --shadow:0 10px 30px rgba(20,30,25,.18); --radius:12px;
    --display:Fraunces, Georgia, serif; --body:Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme:light;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--ground); color:var(--ink); font:14px/1.45 var(--body); -webkit-font-smoothing:antialiased; }
  .app { display:grid; grid-template-columns:380px 1fr; height:100%; }
  #map { height:100%; background:#e9ede4; }

  /* ---------- sidebar ---------- */
  aside { display:flex; flex-direction:column; min-height:0; background:var(--ground); border-right:1px solid var(--rule); z-index:1000; }
  .topbar, .controls, .list-head { flex:none; }
  .nightbar { padding:4px 16px 0; }
  .filterbox { display:grid; grid-template-columns:minmax(0, 1fr); gap:14px; }
  .filters-toggle { display:none; }
  .hero { position:relative; overflow:hidden; padding:20px 20px 52px; background:linear-gradient(180deg,var(--pine-soft) 0%,var(--ground) 100%); }
  .hero svg.ridge { position:absolute; left:0; right:0; bottom:-1px; width:100%; height:58px; pointer-events:none; }
  .brand { position:relative; display:flex; align-items:center; gap:10px; }
  .brand svg { width:36px; height:36px; flex:none; }
  /* the logo is the (discreet) switch to the "avant-dernière couchette" mode */
  .logo { border:0; background:none; padding:0; margin:0; cursor:pointer; line-height:0; border-radius:8px; transition:transform .2s; }
  .logo:hover { transform:rotate(-6deg) scale(1.06); }
  .logo:focus-visible { outline:2px solid var(--glow); outline-offset:3px; }
  .logo .star { transition:transform .4s; transform-origin:22px 7px; }
  /* "avant-dernière couchette": dusk tint, star turned over */
  .penultimate .hero { background:linear-gradient(180deg,#f1dcc4 0%,var(--ground) 100%); }
  .penultimate .logo .star { transform:rotate(180deg); }
  .penultimate .brand h1 { font-size:22px; }
  .mode-note { display:none; font:500 10.5px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--glow); margin-top:4px; }
  .penultimate .mode-note { display:block; }
  .brand h1 { margin:0; font:700 25px/1 var(--display); letter-spacing:-.01em; color:var(--ink); }
  .brand .meta a { white-space:nowrap; color:inherit; text-decoration:underline dotted; text-underline-offset:3px; }
  .brand .meta a:hover { color:var(--pine); }
  .brand .meta { display:block; font:500 10.5px/1.3 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin-top:5px; }
  .hero .handle { display:none; }

  .controls { padding:4px 16px 6px; display:grid; grid-template-columns:minmax(0, 1fr); gap:14px; }
  .label { font:600 10.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); margin-bottom:7px; }

  /* night carousel: tickets, selected one centered, neighbours half visible */
  .carousel { position:relative; overflow:hidden; margin:0 -16px; padding:6px 0 4px; }
  .track { display:flex; gap:12px; transition:transform .4s cubic-bezier(.2,.8,.2,1); will-change:transform; }
  .track button { flex:0 0 52%; padding:0; border:0; background:none; font:inherit; color:inherit; cursor:pointer; text-align:left;
    transform:scale(.9); opacity:.55; transition:transform .3s, opacity .3s; }
  .track button[aria-pressed=true] { transform:scale(1); opacity:1; }
  .track button:not([aria-pressed=true]):hover { opacity:.8; }
  .ticket { display:grid; grid-template-columns:1fr auto; background:var(--paper); border:1px solid var(--rule); border-radius:8px; position:relative; }
  .ticket .main { padding:10px 12px; border-right:2px dashed var(--perf); }
  .ticket .k { font:600 9.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); }
  .ticket .d { font:700 21px/1.05 var(--display); text-transform:capitalize; margin:5px 0 1px; }
  .ticket .dt { font:400 11.5px/1.2 var(--mono); color:var(--ink-2); }
  .ticket .stub { display:grid; place-content:center; text-align:center; padding:8px 10px; min-width:58px; }
  .ticket .stub b { font:600 20px/1 var(--mono); color:var(--pine); font-variant-numeric:tabular-nums; }
  .ticket .stub small { font:500 9px/1.15 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); }
  .ticket::before, .ticket::after { content:""; position:absolute; right:56px; width:12px; height:12px; border-radius:50%; background:var(--ground); border:1px solid var(--rule); }
  .ticket::before { top:-7px; } .ticket::after { bottom:-7px; }
  [aria-pressed=true] .ticket { border-color:var(--pine); box-shadow:0 8px 20px rgba(36,73,58,.2); }

  /* key numbers: one ticket, three stubs */
  .stats { display:grid; grid-template-columns:1fr 1fr; background:var(--paper); border:1px solid var(--rule); border-radius:8px; }
  .stat { padding:7px 12px; min-width:0; display:flex; align-items:center; gap:8px; }
  .stat + .stat { border-left:2px dashed var(--perf); }
  .stat b { font:600 18px/1.1 var(--mono); font-variant-numeric:tabular-nums; }
  .stat span { font-size:11.5px; color:var(--ink-2); display:flex; align-items:center; gap:5px; }

  .filters { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; color:var(--ink); font-size:13px; }
  .switch[hidden] { display:none; }
  .switch input { appearance:none; width:34px; height:20px; border-radius:20px; background:var(--rule); position:relative; cursor:pointer; transition:.2s; margin:0; flex:none; }
  .switch input::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked { background:var(--pine); }
  .switch input:checked::after { left:16px; }
  .stepper { display:inline-flex; align-items:center; border:1px solid var(--rule); border-radius:8px; background:var(--paper); overflow:hidden; }
  .stepper button { border:0; background:none; color:var(--ink); width:30px; height:30px; font-size:16px; cursor:pointer; }
  .stepper button:hover { background:var(--pine-soft); }
  .stepper output { font:600 12.5px/1 var(--mono); min-width:74px; text-align:center; }

  .chipset { display:flex; flex-wrap:wrap; gap:6px; }
  .tchip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); background:transparent; color:var(--ink-2); border-radius:999px;
    padding:5px 10px 5px 7px; font:500 12.5px/1 var(--body); cursor:pointer; transition:all .15s; }
  .tchip svg { width:18px; height:18px; }
  .tchip i { font:600 11px/1 var(--mono); font-style:normal; opacity:.7; }
  .tchip:hover { border-color:var(--pine); color:var(--ink); }
  .tchip[aria-pressed=true] { background:var(--paper); border-color:var(--pine); color:var(--ink); }
  .search { width:100%; border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:8px; padding:8px 10px; font:inherit; }
  .search:focus, .tchip:focus-visible, .track button:focus-visible, .stepper button:focus-visible, .switch input:focus-visible, ul.huts li:focus-visible {
    outline:2px solid var(--glow); outline-offset:2px; }

  .list-head { display:flex; justify-content:space-between; align-items:baseline; padding:12px 16px 6px; }
  .list-head .label { margin:0; }
  .list-head small { font:400 11px/1 var(--mono); color:var(--ink-2); }
  ul.huts { list-style:none; margin:0; padding:0 16px 16px; overflow-y:auto; flex:1; min-height:0; display:grid; gap:8px; align-content:start; }
  ul.huts li { display:grid; grid-template-columns:36px 1fr auto; align-items:center; background:var(--paper); border:1px solid var(--rule);
    border-radius:8px; cursor:pointer; transition:border-color .12s, box-shadow .12s; }
  ul.huts li:hover, ul.huts li.active { border-color:var(--pine); box-shadow:0 4px 12px rgba(36,73,58,.12); }
  ul.huts .ic { display:grid; place-items:center; padding-left:6px; }
  ul.huts .ic svg { width:24px; height:24px; }
  ul.huts .nm { padding:8px; min-width:0; }
  ul.huts .name { font-weight:600; font-size:13.5px; line-height:1.25; }
  ul.huts .sub { font:400 11px/1.3 var(--mono); color:var(--ink-2); }
  ul.huts .bd { border-left:2px dashed var(--perf); padding:6px 10px; text-align:center; min-width:62px; align-self:stretch; display:grid; place-content:center; }
  ul.huts .bd b { font:600 17px/1 var(--mono); font-variant-numeric:tabular-nums; }
  ul.huts .bd small { font:400 10px/1.2 var(--mono); color:var(--ink-2); }
  ul.huts .bd .tag { font:700 9.5px/1.1 var(--mono); letter-spacing:.06em; text-transform:uppercase; }
  ul.huts li.empty { display:block; cursor:default; text-align:center; color:var(--ink-2); padding:24px 16px; background:none; border-style:dashed; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
  .bar { height:4px; border-radius:4px; background:var(--rule); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:4px; }

  /* ---------- markers: ticket stubs ---------- */
  .leaflet-marker-icon.leaflet-div-icon, .tpin-wrap { background:none; border:0; }
  .tpin { position:absolute; left:0; top:0; transform:translate(-50%, calc(-100% - 6px)); display:inline-flex; align-items:stretch; white-space:nowrap;
    background:var(--paper); border:1px solid #cfc7b5; border-radius:5px; box-shadow:0 3px 8px rgba(0,0,0,.22);
    font:600 12px/1 var(--mono); color:var(--ink); transition:transform .15s; font-variant-numeric:tabular-nums; }
  .tpin span { padding:4px 5px; }
  .tpin span + span { border-left:1.5px dashed #cfc7b5; font-size:9px; display:grid; place-items:center; }
  .tpin::after { content:""; position:absolute; left:50%; bottom:-5px; width:8px; height:8px; transform:translateX(-50%) rotate(45deg);
    background:var(--paper); border-right:1px solid #cfc7b5; border-bottom:1px solid #cfc7b5; }
  .tpin:hover, .tpin.active { transform:translate(-50%, calc(-100% - 6px)) scale(1.2); z-index:1000; }
  .tpin.active { border-color:var(--pine); }
  .tpin.req span:first-child { color:#6b5ca5; }
  .tpin svg { display:block; width:12px; height:12px; }
  .note { margin:10px 0 0; padding:7px 10px; border-radius:6px; background:#fbf3e6; color:#8a5414; font-size:12px; line-height:1.4; }
  .contact { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:10px; font:500 12.5px/1.3 var(--mono); }
  .contact a { color:var(--pine); text-decoration:none; }
  .contact a:hover { text-decoration:underline; }
  .cpin { position:absolute; left:0; top:0; width:10px; height:10px; transform:translate(-50%,-50%); border-radius:50%;
    background:var(--closed); border:1.5px solid var(--paper); box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .cpin.active { transform:translate(-50%,-50%) scale(1.5); }
  /* IGN serves the ski touring traces in red only: shift them to blue, as on the IGN site */
  .ski-traces { filter:hue-rotate(205deg) saturate(1.6) brightness(.9); }

  /* ---------- popup: a larger ticket ---------- */
  .leaflet-popup-content-wrapper { border-radius:var(--radius); box-shadow:var(--shadow); background:var(--paper); color:var(--ink); padding:0; overflow:hidden; border:1px solid var(--rule); }
  .leaflet-popup-tip { background:var(--paper); }
  .leaflet-popup-content { margin:0; width:300px !important; font:inherit; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--ink-2); top:8px; right:8px; font-size:20px; }
  .card-head { padding:14px 16px 12px; border-bottom:2px dashed var(--perf); display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start; }
  .card-head .ic svg { width:30px; height:30px; }
  .card-head h3 { margin:0; font:700 17px/1.2 var(--display); padding-right:18px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .chip { font:500 10.5px/1 var(--mono); padding:4px 7px; border-radius:999px; background:var(--ground); color:var(--ink-2); border:1px solid var(--rule); }
  .card-body { padding:10px 16px 14px; }
  .night { display:grid; grid-template-columns:100px 1fr auto; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--rule); }
  .night:last-of-type { border-bottom:0; }
  .night.sel .d { font-weight:700; color:var(--pine); }
  .night .d { font:500 11.5px/1.2 var(--mono); text-transform:capitalize; white-space:nowrap; }
  .night .st { font-size:11px; color:var(--ink-2); }
  .night .n { font:600 13px/1 var(--mono); font-variant-numeric:tabular-nums; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .actions a { flex:1; text-align:center; text-decoration:none; padding:8px; border-radius:8px; font-weight:600; font-size:13px; }
  .actions a.primary { flex:2; background:var(--pine); color:#fff !important; }
  .actions a.resa { background:var(--paper); color:var(--pine) !important; border:1.5px solid var(--pine); }
  .actions .break { flex-basis:100%; height:0; }
  .actions a.ghost { background:var(--ground); color:var(--ink) !important; border:1px solid var(--rule); }

  .leaflet-control-layers, .leaflet-bar { border:1px solid var(--rule) !important; border-radius:10px !important; box-shadow:var(--shadow) !important; overflow:hidden; }
  .leaflet-bar a { background:var(--paper); color:var(--ink); border-color:var(--rule); }
  .leaflet-control-layers { background:var(--paper); color:var(--ink); }
  .leaflet-tooltip { font:12px/1.35 var(--body); border-radius:6px; }

  /* ---------- mobile: bottom sheet ---------- */
  @media (max-width:760px) {
    .app { grid-template-columns:1fr; }
    #map { position:fixed; inset:0; }
    /* 3. the sheet can rise to 90% of the screen */
    aside { position:fixed; left:0; right:0; bottom:0; max-height:90vh; max-height:90dvh; border-right:0; border-radius:18px 18px 0 0;
      box-shadow:0 -8px 30px rgba(0,0,0,.25); transition:transform .25s;
      /* 1. the whole sheet scrolls as one block; only the top bar stays */
      display:block; overflow-y:auto; overscroll-behavior:contain; }
    aside.collapsed { transform:translateY(calc(100% - 78px)); overflow:hidden; }
    .topbar { position:sticky; top:0; z-index:5; background:var(--ground); box-shadow:0 6px 10px -8px rgba(20,30,25,.35); }
    .hero { padding:8px 16px 18px; cursor:pointer; }
    .hero .handle { display:block; width:40px; height:4px; border-radius:4px; background:rgba(36,73,58,.35); margin:0 auto 8px; }
    .brand svg { width:28px; height:28px; }
    .brand h1, .penultimate .brand h1 { font-size:19px; }
    .brand .meta { margin-top:3px; }
    .mode-note { font-size:9.5px; margin-top:2px; }
    .hero svg.ridge { height:20px; }
    /* compact night tickets in the top bar */
    .nightbar { padding:0 16px 8px; }
    .carousel { padding:4px 0 2px; }
    .ticket .main { padding:6px 10px; }
    .ticket .k { display:none; }
    .ticket .d { font-size:16px; margin:0 0 1px; }
    .ticket .dt { font-size:10.5px; }
    .ticket .stub { padding:4px 8px; min-width:50px; }
    .ticket .stub b { font-size:16px; }
    .ticket .stub small { font-size:8px; }
    .ticket::before, .ticket::after { right:48px; }
    .controls { padding-top:10px; gap:10px; }
    /* 2. filters folded behind a button */
    .filters-toggle { display:flex; align-items:center; gap:8px; width:100%; border:1px solid var(--rule); background:var(--paper); color:var(--ink);
      border-radius:8px; padding:9px 12px; font:600 13px/1 var(--body); cursor:pointer; }
    .filters-toggle svg { width:18px; height:18px; color:var(--pine); }
    .filters-toggle .chev { margin-left:auto; color:var(--ink-2); transition:transform .2s; }
    .filters-toggle[aria-expanded=true] .chev { transform:rotate(180deg); }
    .filters-toggle.active { border-color:var(--pine); }
    .filterbox { display:none; padding:2px 0 4px; }
    .filterbox.open { display:grid; }
    ul.huts { overflow:visible; padding-bottom:max(16px, env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { .track, .track button, aside { transition:none; } }
</style>
</head>
<body>
<div class="app">
  <aside id="sheet">
    <div class="topbar">
    <div class="hero" id="hero">
      <div class="handle"></div>
      <div class="brand">
        <button class="logo" id="logo" type="button" title="Psst… et le week-end d'après ?" aria-pressed="false"
          aria-label="Avant-dernière couchette : voir le week-end suivant">
        <svg viewBox="0 0 34 34" fill="none" stroke="#24493a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 31V12M28 31V12"/><path d="M6 19h22M6 27h22"/><path d="M9 19v-3.5h7V19M9 27v-3.5h7V27"/>
          <path class="star" d="m22 3 1.2 2.6 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4z" fill="#d98a2b" stroke="none"/></svg></button>
        <div><h1 id="title">Dernière couchette</h1><span class="meta" id="meta"></span>
          <span class="mode-note">Week-end suivant</span></div>
      </div>
      <svg class="ridge" viewBox="0 0 380 60" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 60 L0 34 L30 26 L52 32 L84 10 L106 22 L128 16 L160 36 L190 18 L214 26 L246 2 L270 20 L292 14 L318 30 L346 22 L380 32 L380 60 Z" fill="#24493a" opacity=".22"/>
        <path d="M0 60 L0 44 L40 38 L70 44 L104 30 L140 42 L178 34 L212 46 L250 32 L286 42 L322 36 L356 44 L380 40 L380 60 Z" fill="#24493a" opacity=".45"/>
        <path d="M0 60 L0 52 L50 48 L96 54 L150 47 L200 53 L262 46 L320 52 L380 49 L380 60 Z" fill="#f5f2ea"/>
      </svg>
    </div>
    <div class="nightbar">
      <div class="carousel" id="carousel"><div class="track" id="nights"></div></div>
    </div>
    </div>
    <div class="controls">
      <div>
        <div class="label">Sur la carte</div>
        <div class="stats" id="stats"></div>
      </div>
      <button class="filters-toggle" id="filtersToggle" type="button" aria-expanded="false" aria-controls="filterbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span id="filtersLabel">Filtres</span><span class="chev" aria-hidden="true">▾</span></button>
      <div class="filterbox" id="filterbox">
      <div class="filters">
        <div class="stepper" aria-label="Places libres minimum">
          <button id="minus" aria-label="Moins de places">−</button>
          <output id="minFree">1+ places</output>
          <button id="plus" aria-label="Plus de places">+</button>
        </div>
        <label class="switch" id="dimSwitch" hidden><input type="checkbox" id="dimFull" checked> Afficher les complets</label>
      </div>
      <div>
        <div class="label">Type</div>
        <div class="chipset" id="types"></div>
      </div>
      <input class="search" id="search" type="search" placeholder="Chercher un refuge…" autocomplete="off" aria-label="Chercher un refuge">
      </div>
    </div>
    <div class="list-head"><div class="label" id="listTitle">Refuges</div></div>
    <ul class="huts" id="list"></ul>
  </aside>
  <div id="map"></div>
</div>
<script>
const DATA = __DATA__;
const COLORS = { ok:'#2f8a57', low:'#d98a2b', request:'#6b5ca5', full:'#c8473d', closed:'#9aa29c' };
// "Sur demande": why a night is not bookable online but still worth a call
const REQUEST = { waitlist:"Liste d'attente", phone:'Par téléphone / mail', request:'Contacter le refuge' };
const REQUEST_SHORT = { waitlist:"liste d'attente", phone:'tél. / mail', request:'tél. / mail' };
// marker icons (inline SVG, currentColor): hourglass = waiting list
const PIN_ICONS = {
  waitlist: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="liste d\'attente"><path d="M4 2h8M4 14h8"/><path d="M5 2v2.5L8 8l3-3.5V2M5 14v-2.5L8 8l3 3.5V14"/><path d="M6.5 12.5h3" stroke-width="1.4"/></svg>',
};
const REQUEST_GLYPH = { waitlist:PIN_ICONS.waitlist, phone:'☎', request:'☎' };
// hut-type icons (inline SVG, coloured with currentColor)
const HUT_ICONS = {
  // guarded hut: chimney smoke
  refuge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 12 12 4l9 8"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/><path d="M16 6.5V4.5h2V8"/><path d="M17 3c.6-.8 1.6-.8 2.2-1.6"/></svg>',
  // unguarded / winter room: no smoke, a small star
  refuge_non_garde: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 12 12 4l9 8"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/><path d="m19 2.5.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5z" fill="currentColor" stroke="none"/></svg>',
  // chalets, centres: wide chalet with balcony
  autre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M2 11.5 12 5l10 6.5"/><path d="M4.5 10v9.5h15V10"/><path d="M4.5 14.5h15"/><path d="M8 14.5v5M12 14.5v5M16 14.5v5"/></svg>',
};
const STATUS = { ok:'Places dispo', low:'Presque complet', request:'Sur demande', full:'Complet', closed:'Fermé' };
const OPENING = { OPEN:'Ouvert', CLOSE:'Fermé', UNGUARDED:'Accès libre' };
const TYPES = { refuge:'Refuge gardé', refuge_non_garde:'Non gardé', chalet:'Chalet', centre:'Centre' };
const TYPE_CHIPS = { refuge:'Gardé', refuge_non_garde:'Non gardé', autre:'Autre' };
// chip of a hut for a night (n = night(h, d)): « Non gardé » when the night shown is its unguarded
// part (or a winter room on its own), « Gardé » for other refuges (closed ones too), chalets,
// centres… go to « Autre »
const chipOf = (h, n) => n?.unguarded || h.type === 'refuge_non_garde' ? 'refuge_non_garde' : h.type === 'refuge' ? 'refuge' : 'autre';
// the icon follows the night: a guarded hut in its unguarded period gets the winter-room icon
const hutIcon = (h, n) => HUT_ICONS[n?.unguarded ? 'refuge_non_garde' : h.type in HUT_ICONS ? h.type : 'autre'];
// FFCAM centrale portals: their unguarded nights follow the FFCAM rule (booking advised, bed not guaranteed)
const CENTRALE = ['FFCAM', 'VANOISE', 'NEOUVIELLE', 'BOREON'];
const GROUP = { ok:'bookable', low:'bookable', request:'request', full:'full', closed:'closed' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day = (d, o) => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', o);
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const shortName = h => h.name.replace(/\s*\(FFCAM\)\s*/, '').replace(/\s+/g, ' ').trim();

function status(n) {
  // manual huts (phone / mail only), and FFCAM nights in waiting list or no longer sold online
  if (n?.booking === 'request') return 'request';
  if (n && (n.booking === 'waitlist' || n.booking === 'phone') && !n.free && n.opening !== 'CLOSE') return 'request';
  // capacity is null for Open System huts (only free beds are known): unknown, not closed
  if (!n || n.opening !== 'OPEN' || n.capacity === 0 || (n.capacity == null && n.free == null)) return 'closed';
  if (!n.free) return 'full';
  return n.free <= Math.max(2, Math.round((n.capacity || 0) * 0.1)) ? 'low' : 'ok';
}

// What a hut offers a given night: the guarded hut when it is open; otherwise its FFCAM winter
// room (« X Non Gardé », folded into it by lib/map_data.rb) if that one is open, marked unguarded.
function night(h, d) {
  const n = h.nights[d];
  // bookable without a keeper (WP Booking System « Disponible (non-gardé) »: UNGUARDED + a booking mode)
  if (n?.opening === 'UNGUARDED' && n.booking) return { ...n, opening:'OPEN', unguarded: true };
  if (status(n) !== 'closed') return n;
  if (n?.winter && status(n.winter) !== 'closed') return { ...n.winter, unguarded: true };
  return n;
}
// « Afficher les complets » unchecked (waiting lists too): full and waiting-list nights drawn like closed huts (grey dot,
// listed with them); their tooltip, popup and tag still say what they are
const dimmable = (s, n) => s === 'full' || (s === 'request' && n?.booking === 'waitlist');
const shown = (s, n) => state.dim && dimmable(s, n) ? 'closed' : s;
const stateText = (n, st) => {
  const t = st === 'closed' ? (OPENING[n?.opening] || 'Pas de données') : st === 'request' ? REQUEST[n.booking] : STATUS[st];
  return n?.unguarded ? `Non gardé · ${t}` : t;
};

// The data holds this weekend's remaining nights and the next weekend. Group them by weekend (Friday).
const fridayOf = d => { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() - (t.getDay() + 2) % 7); return t.toISOString().slice(0, 10); };
const WEEKENDS = Object.values(DATA.dates.reduce((acc, d) => ((acc[fridayOf(d)] ||= []).push(d), acc), {}));
// mode "last" = dernière couchette (this weekend), "penultimate" = avant-dernière (next weekend)
const weekendDates = mode => (mode === 'penultimate' && WEEKENDS[1]) || WEEKENDS[0] || [];
const defaultNightOf = dates => dates.find(d => new Date(d + 'T12:00:00').getDay() === 6) || dates[0];
const startMode = location.hash === '#avant-derniere' && WEEKENDS[1] ? 'penultimate' : 'last';
const state = { mode: startMode, night: defaultNightOf(weekendDates(startMode)), minFree: 1, dim: false, types: new Set(Object.keys(TYPE_CHIPS)), q: '', active: null };

/* ---------- map ---------- */
const layers = {
  'Relief (OpenTopoMap)': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom:17,
    attribution:'&copy; OpenStreetMap, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)' }),
  'Topo clair (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:19,
    attribution:'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors' }),
  'Satellite (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:18,
    attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics' }),
  'Plan IGN': L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM_0_19&FORMAT=image/png&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
    { maxZoom:19, attribution:'&copy; <a href="https://www.ign.fr">IGN</a> Géoplateforme' }),
  // OSM France tiles: tile.openstreetmap.org blocks pages opened from file:// (no Referer header)
  'OpenStreetMap France': L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', { maxZoom:20, subdomains:'abc',
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | tuiles <a href="https://www.openstreetmap.fr">OSM France</a>' }),
};
// IGN SCAN 25 (the paper 1:25 000 maps) needs a personal IGN API key: bin/build-site --ign-key KEY
if (DATA.ignKey) layers['IGN SCAN 25'] = L.tileLayer(
  `https://data.geopf.fr/private/wmts?apikey=${encodeURIComponent(DATA.ignKey)}&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.MAPS.SCAN25TOUR&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`,
  { minZoom:6, maxZoom:16, attribution:'&copy; <a href="https://www.ign.fr">IGN</a> SCAN 25' });
const map = L.map('map', { layers:[layers['Topo clair (Esri)']], zoomControl:false, zoomSnap:0.25 });
L.control.zoom({ position:'topright' }).addTo(map);
// overlays (checkboxes in the layer menu), drawn on top of any base map
const overlays = {
  'Traces ski de rando (IGN)': L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=TRACES.RANDO.HIVERNALE&STYLE=normal&TILEMATRIXSET=PM_6_16&FORMAT=image/png&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}',
    { minZoom:6, maxNativeZoom:16, maxZoom:20, opacity:0.9, className:'ski-traces', attribution:'Traces de randonnée hivernale &copy; IGN' }),
};
L.control.layers(layers, overlays, { position:'topright' }).addTo(map);
L.control.scale({ imperial:false, position:'bottomright' }).addTo(map);
// initial view: French Alps, from the Hautes-Alpes (south) to Lake Geneva (north)
const ALPS = L.latLngBounds([44.7, 5.7], [46.42, 7.1]);
const isMobile = () => window.innerWidth <= 760;
if (isMobile()) document.getElementById('sheet').classList.add('collapsed');
map.fitBounds(ALPS, { paddingBottomRight: isMobile() ? [0, 120] : [0, 0] });

const markers = new Map();
const markerLayer = L.layerGroup().addTo(map);

// markers: a small ticket stub (free beds | status dot) pointing at the hut; closed huts are a grey dot.
// The icon is a 0x0 box at the hut's position; the visible pin is positioned around it in CSS.
function icon(h, s, n) {
  if (s === 'closed') return L.divIcon({ className:'tpin-wrap', iconSize:[0, 0], html:'<div class="cpin"></div>' });
  const label = s === 'request' ? REQUEST_GLYPH[n.booking] : s === 'full' ? 0 : n.free;
  return L.divIcon({ className:'tpin-wrap', iconSize:[0, 0],
    html:`<div class="tpin${s === 'request' ? ' req' : ''}"><span>${label}</span><span style="color:${COLORS[s]}">●</span></div>` });
}

function popup(h) {
  const cur = night(h, state.night), s = status(cur);
  // the selected night shows the winter room (« Non gardé »): book that one
  const resa = cur?.unguarded && h.winterBooking ? h.winterBooking : h.booking;
  const dates = weekendDates(state.mode);
  const nights = dates.map(d => {
    const n = night(h, d) || {}, st = status(n);
    const pct = n.capacity ? Math.round(100 * (n.free || 0) / n.capacity) : (st === 'closed' || st === 'full' || st === 'request' ? 0 : 100);
    return `<div class="night ${d === state.night ? 'sel' : ''}">
      <div><div class="d">${esc(day(d, { weekday:'short', day:'numeric', month:'short' }))}</div>
        <div class="st">${esc(stateText(n, st))}</div></div>
      <div class="bar"><i style="width:${pct}%;background:${COLORS[st]}"></i></div>
      <div class="n">${st === 'closed' || st === 'request' ? '–' : `<span style="color:${COLORS[st]}">${n.free}</span><span style="color:var(--ink-2);font-weight:400"> ${n.capacity != null ? `/ ${n.capacity}` : 'pl.'}</span>`}</div>
    </div>`;
  }).join('');
  return `<div class="card-head"><span class="ic" style="color:${COLORS[s]}">${hutIcon(h, cur)}</span>
      <div><h3>${esc(shortName(h))}</h3>
      <div class="chips"><span class="chip">${esc(cur?.unguarded ? 'Non gardé' : TYPES[h.type] || h.type)}</span>
        ${h.ele ? `<span class="chip">▲ ${h.ele} m</span>` : ''}
        ${h.maxPax ? `<span class="chip">max ${h.maxPax} pers./résa</span>` : ''}</div></div>
    </div>
    <div class="card-body">${nights}
      ${CENTRALE.includes(h.portal) && (h.type === 'refuge_non_garde' || dates.some(d => night(h, d)?.unguarded)) ? '<p class="note"><b>Non gardé</b> : réservation conseillée, lit non garanti.</p>' : ''}
      ${h.phone || h.email ? `<div class="contact">${h.phone ? `<a href="tel:${esc(h.phone.replace(/[^+0-9]/g, ''))}">☎ ${esc(h.phone)}</a>` : ''}
        ${h.email ? `<a href="mailto:${esc(h.email)}">${esc(h.email)}</a>` : ''}</div>` : ''}
      <div class="actions">
        ${h.site ? `<a class="primary" href="${esc(h.site)}" target="_blank" rel="noopener">Site du refuge</a>` : ''}
        ${resa ? `<a class="resa" href="${esc(resa)}" target="_blank" rel="noopener" title="Page de réservation">⚡ Résa</a>` : ''}
        <span class="break"></span>
        ${h.c2c ? `<a class="ghost" href="${esc(h.c2c)}" target="_blank" rel="noopener">Camptocamp</a>` : ''}
        ${h.skitour ? `<a class="ghost" href="${esc(h.skitour)}" target="_blank" rel="noopener">Skitour</a>` : ''}
      </div>
    </div>`;
}

/* ---------- sidebar ---------- */
const nightsEl = document.getElementById('nights');
function buildNights() {
 nightsEl.replaceChildren();
 weekendDates(state.mode).forEach(d => {
  const b = document.createElement('button');
  const bookable = DATA.huts.filter(h => ['ok', 'low'].includes(status(night(h, d)))).length;
  b.innerHTML = `<div class="ticket"><div class="main"><div class="k">Nuit du</div><div class="d">${esc(day(d, { weekday:'long' }))}</div>
    <div class="dt">${esc(day(d, { day:'2-digit', month:'2-digit' }))}</div></div>
    <div class="stub"><b>${bookable}</b><small>refuges<br>libres</small></div></div>`;
  b.setAttribute('aria-label', `Nuit du ${day(d, { weekday:'long', day:'numeric', month:'long' })}, ${bookable} refuges réservables`);
  b.onclick = () => selectNight(d);
  b.dataset.date = d;
  nightsEl.append(b);
 });
}
buildNights();
function selectNight(d) { if (d && d !== state.night) { state.night = d; render(); } }
function stepNight(delta) { const ds = weekendDates(state.mode); selectNight(ds[ds.indexOf(state.night) + delta]); }

// "avant-dernière couchette": the logo switches to next weekend (and back); #avant-derniere in the URL opens it directly
function setMode(mode) {
  if (mode === 'penultimate' && !WEEKENDS[1]) return;
  state.mode = mode;
  state.night = defaultNightOf(weekendDates(mode));
  const pen = mode === 'penultimate';
  document.getElementById('sheet').classList.toggle('penultimate', pen);
  document.getElementById('title').textContent = pen ? 'Avant-dernière couchette' : 'Dernière couchette';
  document.title = pen ? 'Avant-dernière couchette' : 'Dernière couchette';
  const logo = document.getElementById('logo');
  logo.setAttribute('aria-pressed', pen);
  logo.title = pen ? 'Revenir à ce week-end' : "Psst… et le week-end d'après ?";
  history.replaceState(null, '', pen ? '#avant-derniere' : location.pathname + location.search);
  buildNights();
  render();
}
document.getElementById('logo').onclick = e => { e.stopPropagation(); setMode(state.mode === 'last' ? 'penultimate' : 'last'); };
if (!WEEKENDS[1]) document.getElementById('logo').disabled = true;
function centerCarousel() {
  const btn = [...nightsEl.children].find(b => b.dataset.date === state.night);
  if (!btn) return;
  const box = document.getElementById('carousel').clientWidth;
  nightsEl.style.transform = `translateX(${box / 2 - (btn.offsetLeft + btn.offsetWidth / 2)}px)`;
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input') || e.target.closest('#map, #list')) return; // keep Leaflet's arrow-key panning
  if (e.key === 'ArrowLeft') stepNight(-1);
  if (e.key === 'ArrowRight') stepNight(1);
});
// swipe on touch screens
let touchX = null;
nightsEl.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
nightsEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) stepNight(dx < 0 ? 1 : -1);
  touchX = null;
});
window.addEventListener('resize', centerCarousel);
// "màj" links to the fetch log page (releves/, built next to the map by bin/build-site)
document.getElementById('meta').innerHTML =
  `${DATA.huts.length} refuges · <a href="releves/" title="Suivi des relevés" onclick="event.stopPropagation()">màj ${esc(new Date(DATA.fetchedAt).toLocaleString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }))}</a> · <a href="a-propos/" title="Le site, ses sources, son code" onclick="event.stopPropagation()">à propos</a>`;

function focusHut(h, fly = true) {
  state.active = h.id;
  const m = markers.get(h.id);
  if (fly) {
    const z = Math.max(map.getZoom(), 12);
    let target = L.latLng(h.lat, h.lon);
    // phone: the card opens above the pin, so put the pin low on the screen (just above the
    // collapsed sheet, 78px) instead of in the middle, leaving the upper part for the card
    if (isMobile()) {
      const dy = Math.max(0, map.getSize().y / 2 - 78 - 40);
      target = map.unproject(map.project(target, z).subtract([0, dy]), z);
    }
    map.flyTo(target, z, { duration: .8 });
    // open once there: opened mid-flight, the card's own auto-pan is lost
    map.once('moveend', () => m?.openPopup());
  } else m?.openPopup();
  if (isMobile()) document.getElementById('sheet').classList.add('collapsed');
  highlight();
}
function highlight() {
  document.querySelectorAll('ul.huts li').forEach(li => li.classList.toggle('active', li.dataset.id === state.active));
  markers.forEach((m, id) => m.getElement()?.firstElementChild?.classList.toggle('active', id === state.active));
}

function render() {
  [...nightsEl.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.date === state.night));
  centerCarousel();
  document.getElementById('minFree').textContent = `${state.minFree}+ place${state.minFree > 1 ? 's' : ''}`;

  const q = norm(state.q);
  const rows = DATA.huts
    .map(h => { const n = night(h, state.night), s = status(n); return { h, n, s, ds: shown(s, n) }; })
    .filter(({ h, n }) => state.types.has(chipOf(h, n)) && (!q || norm(h.name).includes(q)));

  state.rows = rows;


  // every status is shown (full and closed huts too); the minimum of free beds only applies to
  // bookable huts. A name search ignores it (and, in the list, the map frame): typing a name finds that hut
  state.searching = q !== '';
  const visible = rows.filter(({ n, s }) => state.searching || GROUP[s] !== 'bookable' || n.free >= state.minFree);

  // the switch only shows up when, this night, at least one hut is full or on a waiting list
  const anyDimmable = DATA.huts.some(h => { const n = night(h, state.night); return dimmable(status(n), n); });
  document.getElementById('dimSwitch').hidden = !anyDimmable;

  markerLayer.clearLayers(); markers.clear();
  const order = { closed:0, full:1, request:2, low:3, ok:4 };
  // huts only bookable by phone / mail (manual_huts.json): never online, so just a dot on the map
  const pin = r => r.h.portal === 'MANUAL' ? 'closed' : r.ds;
  visible.sort((a, b) => order[pin(a)] - order[pin(b)]).forEach(r => {
    const { h, n, s } = r, ps = pin(r);
    const m = L.marker([h.lat, h.lon], { icon: icon(h, ps, n), zIndexOffset: order[ps] * 1000, riseOnHover: true, alt: shortName(h) })
      .bindPopup(() => popup(h), { maxWidth: 320, minWidth: 300, autoPanPaddingTopLeft: [20, 20], autoPanPaddingBottomRight: [20, isMobile() ? 90 : 20] })
      .bindTooltip(`<b>${esc(shortName(h))}</b><br>${n?.unguarded ? 'Non gardé · ' : ''}${s === 'closed' ? (OPENING[n?.opening] || STATUS.closed) : s === 'request' ? `Sur demande · ${REQUEST[n.booking]}` : s === 'full' ? `Complet${n.capacity ? ` (${n.capacity} pl.)` : ''}` : `${n.free}${n.capacity != null ? ` / ${n.capacity}` : ''} places`}`,
        { direction: 'top', offset: [0, ps === 'closed' ? -6 : -30] })
      .on('click', () => { state.active = h.id; highlight(); })
      .addTo(markerLayer);
    markers.set(h.id, m);
  });

  state.visible = visible;
  renderList();
  updateFiltersLabel();
}

// Sidebar list: only the huts inside the current map view (re-run on every pan/zoom)
function renderList() {
  const bounds = map.getBounds();
  const inView = ({ h }) => bounds.contains([h.lat, h.lon]);

  // key numbers: huts in the map view, within the current type/search filters
  const viewRows = state.rows.filter(inView);
  const counts = { bookable:0, request:0, full:0, closed:0 };
  viewRows.forEach(r => counts[GROUP[r.s]]++);
  const beds = viewRows.filter(r => GROUP[r.s] === 'bookable').reduce((a, r) => a + r.n.free, 0);
  document.getElementById('stats').innerHTML = [
    [counts.bookable, 'réservables', COLORS.ok], [beds, 'places', COLORS.low],
  ].map(([v, l, c]) => `<div class="stat"><b>${v}</b><span><i class="dot" style="background:${c}"></i>${l}</span></div>`).join('');

  // type chips: huts of each type in the map view
  const typesEl = document.getElementById('types');
  typesEl.innerHTML = Object.entries(TYPE_CHIPS).map(([t, label]) => {
    const n = DATA.huts.filter(h => chipOf(h, night(h, state.night)) === t && bounds.contains([h.lat, h.lon])).length;
    return `<button class="tchip" data-type="${t}" aria-pressed="${state.types.has(t)}">${HUT_ICONS[t]}${label}<i>${n}</i></button>`;
  }).join('');
  typesEl.querySelectorAll('.tchip').forEach(b => b.onclick = () => toggle(state.types, b.dataset.type, Object.keys(TYPE_CHIPS)));

  const gOrder = { bookable:0, request:1, full:2, closed:3 };
  const listed = state.visible.filter(r => state.searching || inView(r)).sort((a, b) => gOrder[GROUP[a.ds]] - gOrder[GROUP[b.ds]]
    || (b.n?.free || 0) - (a.n?.free || 0) || a.h.name.localeCompare(b.h.name, 'fr'));
  document.getElementById('listTitle').textContent = state.searching ? 'Recherche' : 'Refuges';
  const hidden = state.visible.length - listed.length;
  const list = document.getElementById('list');
  list.innerHTML = listed.length ? listed.map(({ h, n, s, ds }) => {
    const dim = ds !== s; // greyed full / waiting-list hut
    const stub = GROUP[s] === 'bookable' ? `<b style="color:${COLORS[s]}">${n.free}</b><small>${n.capacity != null ? `/ ${n.capacity}` : 'places'}</small>`
      : s === 'request' ? `<span class="tag" style="color:${COLORS[dim ? 'closed' : 'request']}">Sur demande</span><small>${REQUEST_SHORT[n.booking]}</small>`
      : s === 'full' ? `<span class="tag" style="color:${COLORS[dim ? 'closed' : 'full']}">Complet</span>${n.capacity ? `<small>${n.capacity} pl.</small>` : ''}`
      : `<span class="tag" style="color:${COLORS.closed}">${esc(OPENING[n?.opening] || 'Fermé')}</span>`;
    return `<li data-id="${esc(h.id)}" title="${esc(h.name)}" tabindex="0">
      <span class="ic" style="color:${COLORS[ds]}">${hutIcon(h, n)}</span>
      <div class="nm"><div class="name">${esc(shortName(h))}</div>
        <div class="sub">${esc(n?.unguarded ? 'non gardé' : (TYPES[h.type] || h.type).toLowerCase())}${h.ele ? ` · ${h.ele} m` : ''}</div></div>
      <div class="bd">${stub}</div>
    </li>`;
  }).join('') : `<li class="empty">${hidden
      ? `Aucun refuge dans cette zone de la carte.<br>Dézoome ou déplace la carte (${hidden} hors cadre).`
      : 'Aucun refuge ne correspond à ces critères.'}</li>`;
  list.querySelectorAll('li[data-id]').forEach(li => {
    const open = () => focusHut(DATA.huts.find(h => h.id === li.dataset.id));
    li.onclick = open;
    li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  });
  highlight();
}

document.getElementById('minus').onclick = () => { state.minFree = Math.max(1, state.minFree - 1); render(); };
document.getElementById('plus').onclick = () => { state.minFree = Math.min(30, state.minFree + 1); render(); };
// Filter click: when every option is selected, keep only the clicked one;
// otherwise toggle it. An empty selection falls back to the defaults.
function toggle(set, value, all, defaults = all) {
  if (all.every(v => set.has(v))) { set.clear(); set.add(value); }
  else if (set.has(value)) set.delete(value);
  else set.add(value);
  if (!set.size) defaults.forEach(v => set.add(v));
  render();
}
document.getElementById('dimFull').onchange = e => { state.dim = !e.target.checked; render(); };
document.getElementById('search').oninput = e => { state.q = e.target.value; render(); };
document.getElementById('hero').onclick = () => {
  if (window.innerWidth > 760) return;
  const sheet = document.getElementById('sheet');
  if (!sheet.classList.contains('collapsed')) sheet.scrollTop = 0;
  sheet.classList.toggle('collapsed');
};
// phone: filters folded behind a button that shows how many are active
document.getElementById('filtersToggle').onclick = () => {
  const box = document.getElementById('filterbox');
  const open = box.classList.toggle('open');
  document.getElementById('filtersToggle').setAttribute('aria-expanded', open);
};
function updateFiltersLabel() {
  const n = (state.minFree > 1) + (state.dim && !document.getElementById('dimSwitch').hidden) + (state.types.size < Object.keys(TYPE_CHIPS).length) + (state.q.trim() !== '');
  document.getElementById('filtersLabel').textContent = n ? `Filtres · ${n} actif${n > 1 ? 's' : ''}` : 'Filtres';
  document.getElementById('filtersToggle').classList.toggle('active', n > 0);
}
map.on('popupclose', () => { state.active = null; highlight(); });
map.on('moveend', renderList);
if (state.mode === 'penultimate') setMode('penultimate'); else render();
</script>
